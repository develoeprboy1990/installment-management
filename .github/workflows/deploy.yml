name: Deploy Laravel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Which project folder to deploy"
        required: false
        default: "all"
        type: string
      run_migrations:
        description: "Run php artisan migrate --force"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          if-no-files-found: error

  deploy:
    name: Deploy ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: build-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: installment
            path: /home/u136558562/domains/mcqsmind.com/public_html/installment
          - project: installment-management
            path: /home/u136558562/domains/mcqsmind.com/public_html/installment-management
          - project: installment-zia
            path: /home/u136558562/domains/mcqsmind.com/public_html/installment-zia
          - project: installment-demo
            path: /home/u136558562/domains/mcqsmind.com/public_html/installment-demo
          - project: installment-baba
            path: /home/u136558562/domains/mcqsmind.com/public_html/installment-baba

    steps:
      - name: Download built assets
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.project }}
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public-build

      - name: Deploy over SSH
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.project }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ matrix.path }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations == true }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,RUN_MIGRATIONS
          script_stop: true
          script: |
            cd "$DEPLOY_PATH"

            git fetch --all --prune
            git reset --hard origin/main

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            rm -rf public/build
            mkdir -p public/build

      - name: Upload built assets
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.project }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public-build/*"
          target: ${{ matrix.path }}/public/build
          strip_components: 1

      - name: Finish Laravel deploy
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.project }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ matrix.path }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations == true }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,RUN_MIGRATIONS
          script_stop: true
          script: |
            cd "$DEPLOY_PATH"
            php artisan down || true
            trap 'php artisan up || true' EXIT

            php artisan storage:link || true
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            if [ "$RUN_MIGRATIONS" = "true" ]; then
              php artisan migrate --force
            fi

            php artisan optimize
            php artisan up
            trap - EXIT
